name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, armv7, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - run: make build-${{ matrix.arch }} BUILDER=${{ steps.buildx.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: dist/*.tar

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar
            dist/SHA256SUMS

  # Multi-arch image for `/container/add remote-image=...` on RouterOS.
  # Docker Hub is skipped until the DOCKERHUB_TOKEN secret is set.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/namikko-chad/amneziawg-mikrotik
      DOCKERHUB_IMAGE: namikko/amneziawg-mikrotik
      DOCKERHUB_USER: namikko
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "$GHCR_IMAGE"
            if [ "$DOCKERHUB_ENABLED" = true ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=AmneziaWG for MikroTik
            org.opencontainers.image.description=AmneziaWG (Amnezia VPN) client for MikroTik RouterOS 7 as a container with a web UI

      # No attestations and Docker media types: RouterOS picks the image by
      # architecture from a plain manifest list.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=registry,oci-mediatypes=false

      - if: env.DOCKERHUB_ENABLED == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: AmneziaWG (Amnezia VPN) client for MikroTik RouterOS 7 with a web UI
          readme-filepath: README.md
          enable-url-completion: true
